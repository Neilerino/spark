[package]
name = "spark_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["staticlib"]

# Override workspace lint: this crate requires #[no_mangle] and raw pointers
# for its FFI boundary — it cannot forbid unsafe_code.
[lints.rust]
unsafe_code = "allow"

[dependencies]
rayon = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "io-util", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
